<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Graduation cap: brim (diamond/rhombus shape) -->
  <polygon points="16,7 27,12 16,17 5,12" fill="url(#cap)"/>

  <!-- Cap top (darker center) -->
  <polygon points="16,7 27,12 16,17 5,12" fill="white" opacity="0.15"/>

  <!-- Left side of cap body -->
  <path d="M9,13.5 L9,20 Q16,23 16,23 Q16,23 23,20 L23,13.5 L16,17 Z" fill="white" opacity="0.9"/>

  <!-- Tassel cord -->
  <line x1="27" y1="12" x2="27" y2="18" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Tassel ball -->
  <circle cx="27" cy="19.5" r="1.8" fill="#fbbf24"/>
</svg>
